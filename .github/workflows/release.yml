name: Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.3.0)'
        required: true
        default: ''
      changelog:
        description: 'Changelog / Release Notes'
        required: true
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update Version & Increment VersionCode
      id: update_metadata
      env:
        RELEASE_VER: ${{ github.event.inputs.version }}
      run: |
        # 1. Update version string in module.prop
        sed -i "s/^version=.*/version=${RELEASE_VER}/" module.prop
        
        # 2. Increment versionCode by +1 over previous build
        CUR_VC=$(grep '^versionCode=' module.prop | cut -d= -f2 | tr -d '\r')
        if [ -z "$CUR_VC" ] || ! [ "$CUR_VC" -eq "$CUR_VC" ] 2>/dev/null; then
          NEW_VC=1
        else
          NEW_VC=$((CUR_VC + 1))
        fi
        sed -i "s/^versionCode=.*/versionCode=${NEW_VC}/" module.prop
        
        echo "Updated module.prop:"
        cat module.prop
        echo "NEW_VC=${NEW_VC}" >> $GITHUB_OUTPUT

    - name: Format Changelog & Update Files
      env:
        RELEASE_VER: ${{ github.event.inputs.version }}
        NEW_VC: ${{ steps.update_metadata.outputs.NEW_VC }}
        MANUAL_CHANGELOG: ${{ github.event.inputs.changelog }}
      run: |
        # Generate release notes for GitHub Release
        echo "## Changelog" > changelog.txt
        echo "" >> changelog.txt
        echo "$MANUAL_CHANGELOG" >> changelog.txt
        echo "" >> changelog.txt
        echo "---" >> changelog.txt
        echo "### Verification" >> changelog.txt
        echo "Generated by GitHub Actions Run ID: ${{ github.run_id }}" >> changelog.txt
        
        # Update changelog.md for root managers (KernelSU / APatch / Magisk / MMRL update.json)
        ENTRY_FILE="/tmp/new_entry.md"
        echo "## ${RELEASE_VER} (versionCode ${NEW_VC})" > "$ENTRY_FILE"
        echo "$MANUAL_CHANGELOG" >> "$ENTRY_FILE"
        echo "" >> "$ENTRY_FILE"
        
        if [ -f "changelog.md" ]; then
          {
            head -n 2 changelog.md
            cat "$ENTRY_FILE"
            tail -n +3 changelog.md
          } > /tmp/changelog.tmp && mv /tmp/changelog.tmp changelog.md
        else
          echo "# SweetClocker Changelog" > changelog.md
          echo "" >> changelog.md
          cat "$ENTRY_FILE" >> changelog.md
        fi

        # Update update.json for Root Managers
        if [ -f "update.json" ]; then
          sed -i "s/\"version\": \".*\"/\"version\": \"${RELEASE_VER}\"/" update.json
          sed -i "s/\"versionCode\": .*/\"versionCode\": ${NEW_VC},/" update.json
          sed -i "s|\"zipUrl\": \".*\"|\"zipUrl\": \"https://github.com/Lavax88/SweetClocker/releases/download/${RELEASE_VER}/SweetClocker-${RELEASE_VER}.zip\"|" update.json
        fi
        
        echo "Updated changelog.md:"
        cat changelog.md
        
        echo "Updated update.json:"
        cat update.json

    - name: Commit and Push Version & Changelog Update
      env:
        RELEASE_VER: ${{ github.event.inputs.version }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add module.prop changelog.md update.json
        if ! git diff --staged --quiet; then
          git commit -m "chore: release ${RELEASE_VER} [skip ci]"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No metadata changes. Skipping commit."
        fi

    - name: Build Flashable Zip
      env:
        RELEASE_VER: ${{ github.event.inputs.version }}
      run: |
        git archive --format=zip --output=SweetClocker-${RELEASE_VER}.zip HEAD
        echo "Zip verification:"
        unzip -l SweetClocker-${RELEASE_VER}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        body_path: changelog.txt
        draft: false
        prerelease: false
        files: |
          SweetClocker-${{ github.event.inputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
