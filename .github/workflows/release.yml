name: Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for changelog generation

    - name: Update Version & Increment VersionCode
      id: update_metadata
      run: |
        RELEASE_VER="${{ github.event.inputs.version }}"
        
        # 1. Update version string in module.prop
        sed -i "s/^version=.*/version=${RELEASE_VER}/" module.prop
        
        # 2. Increment versionCode by +1 over previous build
        CUR_VC=$(grep '^versionCode=' module.prop | cut -d= -f2 | tr -d '\r')
        if [ -z "$CUR_VC" ] || ! [ "$CUR_VC" -eq "$CUR_VC" ] 2>/dev/null; then
          NEW_VC=1
        else
          NEW_VC=$((CUR_VC + 1))
        fi
        sed -i "s/^versionCode=.*/versionCode=${NEW_VC}/" module.prop
        
        echo "Updated module.prop:"
        cat module.prop
        echo "NEW_VC=${NEW_VC}" >> $GITHUB_OUTPUT

    - name: Generate Changelog & Update Files
      run: |
        RELEASE_VER="${{ github.event.inputs.version }}"
        NEW_VC="${{ steps.update_metadata.outputs.NEW_VC }}"
        
        # Fetch tags to find previous version
        git fetch --tags --force
        previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || git tag --sort=-v:refname | head -n 1 || true)
        
        # Generate release notes for GitHub Release
        echo "## Changelog" > changelog.txt
        echo "" >> changelog.txt
        if [ -z "$previous_tag" ]; then
          echo "No previous release tag found. Logging commits:"
          git log --pretty=format:"### %s (%h)%n%b%n" HEAD >> changelog.txt
        else
          echo "Previous tag: $previous_tag. Logging commits since $previous_tag:"
          git log --pretty=format:"### %s (%h)%n%b%n" ${previous_tag}..HEAD >> changelog.txt
        fi
        
        echo "" >> changelog.txt
        echo "---" >> changelog.txt
        echo "### Verification" >> changelog.txt
        echo "Generated by GitHub Actions Run ID: ${{ github.run_id }}" >> changelog.txt
        
        # Update changelog.md for root managers (KernelSU / APatch / Magisk / MMRL update.json)
        ENTRY_FILE="/tmp/new_entry.md"
        echo "## ${RELEASE_VER} (versionCode ${NEW_VC})" > "$ENTRY_FILE"
        echo "" >> "$ENTRY_FILE"
        if [ -z "$previous_tag" ]; then
          git log --pretty=format:"### %s (%h)%n%b%n" HEAD >> "$ENTRY_FILE"
        else
          git log --pretty=format:"### %s (%h)%n%b%n" ${previous_tag}..HEAD >> "$ENTRY_FILE"
        fi
        echo "" >> "$ENTRY_FILE"
        
        if [ -f "changelog.md" ]; then
          {
            head -n 2 changelog.md
            cat "$ENTRY_FILE"
            tail -n +3 changelog.md
          } > /tmp/changelog.tmp && mv /tmp/changelog.tmp changelog.md
        else
          echo "# SweetClocker Changelog" > changelog.md
          echo "" >> changelog.md
          cat "$ENTRY_FILE" >> changelog.md
        fi

        # Update update.json for Root Managers
        if [ -f "update.json" ]; then
          sed -i "s/\"version\": \".*\"/\"version\": \"${RELEASE_VER}\"/" update.json
          sed -i "s/\"versionCode\": .*/\"versionCode\": ${NEW_VC},/" update.json
          sed -i "s|\"zipUrl\": \".*\"|\"zipUrl\": \"https://github.com/Lavax88/SweetClocker/releases/download/${RELEASE_VER}/SweetClocker-${RELEASE_VER}.zip\"|" update.json
        fi
        
        echo "Updated changelog.md:"
        cat changelog.md
        
        echo "Updated update.json:"
        cat update.json

    - name: Commit and Push Version & Changelog Update
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add module.prop changelog.md update.json
        if ! git diff --staged --quiet; then
          git commit -m "chore: release ${{ github.event.inputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No metadata changes. Skipping commit."
        fi

    - name: Build Flashable Zip
      run: |
        git archive --format=zip --output=SweetClocker-${{ github.event.inputs.version }}.zip HEAD
        echo "Zip verification:"
        unzip -l SweetClocker-${{ github.event.inputs.version }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        body_path: changelog.txt
        draft: false
        prerelease: false
        files: |
          SweetClocker-${{ github.event.inputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
